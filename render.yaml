# Render Blueprint: New > Blueprint > pick this repo > Apply.
# Creates the web service, the daily reminder-email cron job and a managed Postgres database (daily backups on paid plans).
envVarGroups:
  # Shared by the web service and the cron job so the cron job can call /api/cron/reminders.
  - name: demand-now-cron
    envVars:
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: demand-now-db
    plan: basic-256mb
    region: oregon
    databaseName: demandnow
    user: demandnow

services:
  - type: web
    name: demand-now
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: demand-now-db
          property: connectionString
      - fromGroup: demand-now-cron
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set these in the Render dashboard. Anything left blank runs in demo mode.
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: PROCESS_SERVER_EMAIL
        sync: false
      - key: PROCESS_SERVER_PHONE
        sync: false
      - key: SERVICE_OPS_EMAIL
        sync: false
      - key: LIEN_FILING_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_APPS_CHALLENGE
        sync: false
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

  # Daily reminder emails (deadlines 3 days and 1 day ahead, and new steps). 15:00 UTC is 7 or 8 AM in BC.
  # It only calls the web service, which does the work and sends through Resend (RESEND_API_KEY on the web service).
  - type: cron
    name: demand-now-reminders
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 15 * * *"
    buildCommand: echo "No build needed"
    startCommand: node scripts/send-reminders.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: demand-now-cron
      - key: WEB_HOSTPORT
        fromService:
          type: web
          name: demand-now
          property: hostport
      - key: APP_URL
        sync: false
