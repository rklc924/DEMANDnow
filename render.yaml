# Render Blueprint: New > Blueprint > pick this repo > Apply.
# Creates the web service and a managed Postgres database (daily backups on paid plans).
databases:
  - name: demand-now-db
    plan: basic-256mb
    region: oregon
    databaseName: demandnow
    user: demandnow

services:
  - type: web
    name: demand-now
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: demand-now-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set these in the Render dashboard. Anything left blank runs in demo mode.
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: PROCESS_SERVER_EMAIL
        sync: false
      - key: PROCESS_SERVER_PHONE
        sync: false
      - key: SERVICE_OPS_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
